openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: repos
  - name: sessions
  - name: branches
  - name: steps
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /repos:
    get:
      operationId: listRepos
      tags: [repos]
      summary: List seed repositories
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repo"
  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions newest first
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a session and its branch tree
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /branches/{id}/steps:
    get:
      operationId: listBranchSteps
      tags: [steps]
      summary: List all steps for a branch
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Step"
  /branches/{id}/steps/{index}/files:
    get:
      operationId: listStepFiles
      tags: [steps]
      summary: List files at a trajectory step
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StepIndex"
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StepFile"
  /step-file:
    get:
      operationId: readFileAtStep
      tags: [steps]
      summary: Read a file at a trajectory step
      parameters:
        - name: branchId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: index
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileContent"
  /branches/{id}/steps/{index}/context:
    get:
      operationId: getStepContext
      tags: [steps]
      summary: Get exact model context at a step
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/StepIndex"
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
  /branches/{id}/fork:
    post:
      operationId: forkBranch
      tags: [branches]
      summary: Fork a branch from a step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkInput"
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: Forked branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
  /diff:
    get:
      operationId: getDiff
      tags: [branches]
      summary: Compare two trajectory points
      parameters:
        - name: a
          in: query
          required: true
          schema: { type: string }
        - name: b
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StepIndex:
      name: index
      in: path
      required: true
      schema: { type: integer, minimum: 0 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Repo:
      type: object
      required: [id, slug, name, description]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
    Model:
      type: object
      required: [id, name, provider, accent]
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        accent: { type: string }
    Branch:
      type: object
      required: [id, sessionId, modelId, status, stepCount, totalInputTokens, totalOutputTokens]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        parentBranchId: { type: ["string", "null"], format: uuid }
        forkStepIndex: { type: ["integer", "null"] }
        modelId: { type: string }
        systemPrompt: { type: string }
        taskPrompt: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled] }
        stepCount: { type: integer }
        totalInputTokens: { type: integer }
        totalOutputTokens: { type: integer }
        queuePosition: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
    Session:
      type: object
      required: [id, repoId, title, branches, createdAt]
      properties:
        id: { type: string, format: uuid }
        repoId: { type: string, format: uuid }
        title: { type: string }
        branches:
          type: array
          items: { $ref: "#/components/schemas/Branch" }
        createdAt: { type: string, format: date-time }
    SessionSummary:
      allOf:
        - $ref: "#/components/schemas/Session"
    SessionInput:
      type: object
      required: [repoId, title, taskPrompt, modelId]
      properties:
        repoId: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        taskPrompt: { type: string, minLength: 1 }
        modelId: { type: string }
    Step:
      type: object
      required: [id, branchId, index, kind, content, filesChanged, createdAt]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        index: { type: integer }
        kind: { type: string, enum: [user, assistant, tool_call, tool_result] }
        content: {}
        toolName: { type: ["string", "null"] }
        toolArgs: {}
        toolResult: { type: ["string", "null"] }
        commitHash: { type: ["string", "null"] }
        filesChanged:
          type: array
          items: { type: string }
        inputTokens: { type: ["integer", "null"] }
        outputTokens: { type: ["integer", "null"] }
        latencyMs: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    StepFile:
      type: object
      required: [path, changed]
      properties:
        path: { type: string }
        changed: { type: boolean }
        size: { type: integer }
    FileContent:
      type: object
      required: [path, content, language]
      properties:
        path: { type: string }
        content: { type: string }
        language: { type: string }
    Context:
      type: object
      required: [messages, tokenCount]
      properties:
        messages:
          type: array
          items: {}
        tokenCount: { type: integer }
    ForkInput:
      type: object
      required: [stepIndex, modelId]
      properties:
        stepIndex: { type: integer, minimum: 0 }
        modelId: { type: string }
        editedTaskPrompt: { type: ["string", "null"] }
        count: { type: integer, minimum: 1, maximum: 5, default: 1 }
    Diff:
      type: object
      required: [files, patch]
      properties:
        files:
          type: array
          items: { type: string }
        patch: { type: string }

